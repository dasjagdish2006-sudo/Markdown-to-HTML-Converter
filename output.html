<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background: #f9f9f9;
            color: #222;
        }
        pre {
            background: #eee;
            padding: 12px;
            overflow-x: auto;
        }
        code {
            background: #f4f4f4;
            padding: 2px 5px;
            border-radius: 4px;
        }
        blockquote {
            border-left: 4px solid #ccc;
            padding-left: 12px;
            color: #666;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
<h1>Hello World</h1>
<p>This is a <strong>Markdown to HTML</strong> converter.</p>
<h2>Features</h2>
<ul>
<li>Headings</li>
<li>Lists</li>
<li>Code blocks</li>
<li>Tables</li>
</ul>
<blockquote>
<p>This is a blockquote.</p>
</blockquote>
<p>```python
print("Hello, world!")</p>
</body>
</html>
